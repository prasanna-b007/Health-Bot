name: Release

# Builds the publishable artefacts: the two backend images and a signed
# Android app bundle. Runs on a version tag, or manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        required: true
        default: 'manual'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  backend-images:
    name: Backend images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push action server
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.actions
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/actions:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trains the model during the build, so this step takes several minutes.
      - name: Build and push Rasa server
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/rasa:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Signed Android bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # All four are required. Without the keystore the build would silently
      # fall back to the debug key and produce an unpublishable artefact, so
      # this job refuses to run rather than emit one.
      - name: Verify release secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RASA_BASE_URL: ${{ secrets.RASA_BASE_URL }}
          RASA_AUTH_TOKEN: ${{ secrets.RASA_AUTH_TOKEN }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$RASA_BASE_URL" ]   && missing="$missing RASA_BASE_URL"
          [ -z "$RASA_AUTH_TOKEN" ] && missing="$missing RASA_AUTH_TOKEN"
          [ -z "$PLACES_API_KEY" ]  && missing="$missing PLACES_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          case "$RASA_BASE_URL" in
            https://*) ;;
            *) echo "::error::RASA_BASE_URL must use https://"; exit 1 ;;
          esac

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/upload.jks"
          cat > health_bot_app/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${RUNNER_TEMP}/upload.jks
          EOF

      - name: Write build configuration
        working-directory: health_bot_app
        run: |
          cat > env.json <<EOF
          {
            "RASA_BASE_URL": "${{ secrets.RASA_BASE_URL }}",
            "RASA_AUTH_TOKEN": "${{ secrets.RASA_AUTH_TOKEN }}",
            "PLACES_API_KEY": "${{ secrets.PLACES_API_KEY }}",
            "HOSPITAL_SEARCH_RADIUS_M": 5000
          }
          EOF

      - name: Build app bundle
        working-directory: health_bot_app
        run: |
          flutter pub get
          flutter build appbundle --release --dart-define-from-file=env.json

      - name: Remove credentials from the workspace
        if: always()
        run: |
          rm -f health_bot_app/env.json health_bot_app/android/key.properties
          rm -f "${RUNNER_TEMP}/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: health_bot_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
