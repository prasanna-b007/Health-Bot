# ---------------------------------------------------------------------------
# Risk and disposition, independent of which condition wins.
# ---------------------------------------------------------------------------
- id: infant-high-fever
  text: "my baby has a high fever and keeps vomiting"
  symptoms: [high fever, vomiting, chills, fatigue]
  age: 1
  duration_days: 1
  severity: 8
  expect_disposition: urgent_today

- id: elderly-prolonged-cough
  # Three weeks of productive cough at 74. "Within 72 hours" is the defensible
  # answer here and the engine gives it; this vignette originally demanded
  # same-day care, which was the author guessing rather than triaging. It is
  # kept because it pins the age and duration contribution to the score.
  text: "cough with phlegm that won't go away and I get tired easily"
  symptoms: [cough, phlegm, fatigue, malaise, chills]
  age: 74
  duration_days: 21
  severity: 6
  expect_disposition: see_doctor_soon

