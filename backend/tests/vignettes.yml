# Evaluation vignettes for the triage engine.
#
# WHAT THIS IS
# ------------
# Each entry is a presentation written the way a person might actually type
# it, together with what the engine ought to conclude. tests/test_evaluation.py
# replays every one through the real engine -- free-text extraction, intake,
# follow-up questions, scoring, risk, disposition -- and reports accuracy,
# emergency recall and how many questions each assessment took.
#
# WHAT THIS IS NOT
# ----------------
# Clinical validation. These vignettes were written against the same 41-
# condition knowledge base the engine scores from, by someone who is not a
# clinician, so a perfect score here means the engine behaves consistently
# with its own data -- not that it is right about medicine. What the suite is
# genuinely good for is catching the thing unit tests cannot: a change to
# scoring, priors or question selection that quietly makes real presentations
# worse. Treat the numbers as a regression baseline, and read DATA.md before
# quoting them anywhere.
#
# FIELDS
# ------
#   id             unique, kebab-case
#   text           what the user types first
#   symptoms       everything this patient actually has, canonical names. The
#                  simulated user answers follow-up questions from this list,
#                  so it must be complete -- anything absent is answered "no".
#   age / duration_days / severity   intake values sent as metadata
#   expect_condition   canonical name the ranking should lead with (optional)
#   expect_top3        canonical names, at least one of which should appear in
#                      the top three (optional; use when several conditions are
#                      genuinely indistinguishable from the symptoms given)
#   expect_disposition emergency | urgent_today | see_doctor_soon | self_care
#   expect_emergency   true when the red-flag path must fire before triage
#   expect_crisis      true when the mental-health crisis path must fire
#   expect_unspecified true when the engine should decline to name a condition

# ---------------------------------------------------------------------------
# Red flags: these must never reach the ranker at all.
# ---------------------------------------------------------------------------
